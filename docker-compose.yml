name: ${COMPOSE_PROJECT_NAME:-milano-mobility}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
    args:
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Rome
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_dev}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-development-only}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-mobility}
    INGESTION_DB_USER: ${INGESTION_DB_USER:-ingestion_writer}
    INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_dev}
    TRANSFORMER_DB_USER: ${TRANSFORMER_DB_USER:-transformer}
    TRANSFORMER_DB_PASSWORD: ${TRANSFORMER_DB_PASSWORD:-transformer_dev}
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    S3_RAW_BUCKET: raw
    S3_QUARANTINE_BUCKET: quarantine
    S3_CURATED_BUCKET: curated
    GTFS_SOURCE_URL: ${GTFS_SOURCE_URL:-https://dati.comune.milano.it/gtfs.zip}
    GTFS_SOURCE_NAME: ${GTFS_SOURCE_NAME:-comune_milano_official_gtfs}
    GTFS_REQUEST_TIMEOUT_SECONDS: ${GTFS_REQUEST_TIMEOUT_SECONDS:-120}
    SERVICE_AREA_ID: ${SERVICE_AREA_ID:-milano}
    SERVICE_AREA_LATITUDE: ${SERVICE_AREA_LATITUDE:-45.4642}
    SERVICE_AREA_LONGITUDE: ${SERVICE_AREA_LONGITUDE:-9.1900}
    DBT_PROJECT_DIR: /workspace/transformations/dbt
    DBT_PROFILES_DIR: /workspace/transformations/dbt
    DBT_THREADS: ${DBT_THREADS:-1}
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    - ./transformations:/workspace/transformations:ro
    - ./tests/fixtures:/workspace/tests/fixtures:ro
    - airflow-logs:/opt/airflow/logs
    - pipeline-data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

x-pipeline-common: &pipeline-common
  image: milano-mobility-app:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-mobility}
    INGESTION_DB_USER: ${INGESTION_DB_USER:-ingestion_writer}
    INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_dev}
    TRANSFORMER_DB_USER: ${TRANSFORMER_DB_USER:-transformer}
    TRANSFORMER_DB_PASSWORD: ${TRANSFORMER_DB_PASSWORD:-transformer_dev}
    BI_DB_USER: ${BI_DB_USER:-bi_reader}
    BI_DB_PASSWORD: ${BI_DB_PASSWORD:-bi_reader_dev}
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    GTFS_SOURCE_URL: ${GTFS_SOURCE_URL:-https://dati.comune.milano.it/gtfs.zip}
    GTFS_SOURCE_NAME: ${GTFS_SOURCE_NAME:-comune_milano_official_gtfs}
    GTFS_REQUEST_TIMEOUT_SECONDS: ${GTFS_REQUEST_TIMEOUT_SECONDS:-120}
    SERVICE_AREA_ID: ${SERVICE_AREA_ID:-milano}
    SERVICE_AREA_LATITUDE: ${SERVICE_AREA_LATITUDE:-45.4642}
    SERVICE_AREA_LONGITUDE: ${SERVICE_AREA_LONGITUDE:-9.1900}
    DBT_PROJECT_DIR: /workspace/transformations/dbt
    DBT_THREADS: ${DBT_THREADS:-1}
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./:/workspace
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobility}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      INGESTION_DB_USER: ${INGESTION_DB_USER:-ingestion_writer}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_dev}
      TRANSFORMER_DB_USER: ${TRANSFORMER_DB_USER:-transformer}
      TRANSFORMER_DB_PASSWORD: ${TRANSFORMER_DB_PASSWORD:-transformer_dev}
      BI_DB_USER: ${BI_DB_USER:-bi_reader}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:-bi_reader_dev}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_dev}
      METABASE_DB_USER: ${METABASE_DB_USER:-metabase}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./infrastructure/postgres/schema.sql:/opt/mobility-init/schema.sql:ro
      - ./infrastructure/postgres/platform-databases.sql:/opt/mobility-init/platform-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-mobility}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    entrypoint: /bin/sh
    command:
      - -c
      - >
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:-minio}" "${MINIO_ROOT_PASSWORD:-minio_dev_password}" &&
        mc mb --ignore-existing local/raw &&
        mc mb --ignore-existing local/quarantine &&
        mc mb --ignore-existing local/curated &&
        mc version enable local/raw
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - >
        mkdir -p /opt/airflow/logs /opt/airflow/data &&
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs /opt/airflow/data &&
        airflow db migrate &&
        airflow users create
        --username "${AIRFLOW_ADMIN_USER:-admin}"
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Local --lastname Operator
        --role Admin --email admin@example.invalid || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 20
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.52.8
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_dev}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  pipeline:
    <<: *pipeline-common
    profiles: ["tools"]

  frontend:
    <<: *pipeline-common
    entrypoint: ["python", "-m", "milano_mobility.web"]
    command: []
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  demo:
    <<: *pipeline-common
    profiles: ["demo"]
    command:
      - run
      - --feed
      - ${GTFS_SOURCE_URL:-https://dati.comune.milano.it/gtfs.zip}
      - --build
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  pipeline-data:
