name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock -e .
      - run: ruff check ingestion orchestration tests
      - run: ruff format --check ingestion orchestration tests
      - run: mypy ingestion
      - run: pytest -m "not integration" --cov --cov-report=xml
      - uses: gitleaks/gitleaks-action@v2

  integration:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock -e .
      - run: pip install -r requirements-dbt.lock
      - run: docker compose up -d --wait postgres minio
      - run: docker compose run --rm minio-init
      - run: pytest -m integration
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: mobility
          INGESTION_DB_USER: ingestion_writer
          INGESTION_DB_PASSWORD: ingestion_dev
          TRANSFORMER_DB_USER: transformer
          TRANSFORMER_DB_PASSWORD: transformer_dev
          BI_DB_USER: bi_reader
          BI_DB_PASSWORD: bi_reader_dev
          S3_ENDPOINT_URL: http://localhost:9000
          DBT_PROJECT_DIR: ${{ github.workspace }}/transformations/dbt
      - if: always()
        run: docker compose logs --no-color postgres minio

  build:
    runs-on: ubuntu-24.04
    needs: [quality, integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: milano-mobility:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
