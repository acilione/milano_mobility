name: milano_mobility
version: "1.0.0"
config-version: 2

profile: milano_mobility

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

models:
  milano_mobility:
    staging:
      +materialized: view
      +schema: staging_dbt
      +tags: ["staging"]
    core:
      +materialized: table
      +schema: core
      +tags: ["core"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["gold"]

seeds:
  milano_mobility:
    +schema: staging_dbt
    +quote_columns: false
    holidays:
      +column_types:
        date: date
    weather_day:
      +column_types:
        date: date
